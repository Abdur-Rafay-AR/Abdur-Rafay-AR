<svg xmlns="http://www.w3.org/2000/svg" width="880" height="200" viewBox="0 0 880 200" fill="none" role="img" aria-label="Abdur Rafay - AI Systems &amp; Infrastructure">
  <defs>
    <!-- Background Gradient -->
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#08090a" />
      <stop offset="60%" stop-color="#0b0d0e" />
      <stop offset="100%" stop-color="#121516" />
    </linearGradient>

    <!-- Subtle Terracotta Border Gradient -->
    <linearGradient id="borderGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#e0653f" stop-opacity="0.5" />
      <stop offset="30%" stop-color="#2a1d18" stop-opacity="0.35" />
      <stop offset="70%" stop-color="#2a1d18" stop-opacity="0.35" />
      <stop offset="100%" stop-color="#e0653f" stop-opacity="0.5" />
    </linearGradient>

    <!-- Corner Ambient Glow -->
    <radialGradient id="cornerGlow" cx="0%" cy="0%" r="100%">
      <stop offset="0%" stop-color="#e0653f" stop-opacity="0.08" />
      <stop offset="100%" stop-color="#08090a" stop-opacity="0" />
    </radialGradient>
  </defs>

  <style>
    .mono { font-family: 'JetBrains Mono', 'Fira Code', ui-monospace, Menlo, Consolas, monospace; }
    .sans { font-family: 'Switzer', -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif; }
  </style>

  <!-- Background Base -->
  <rect width="880" height="200" rx="12" fill="url(#bgGrad)" />
  <rect width="880" height="200" rx="12" fill="url(#cornerGlow)" />

  <!-- Top Metadata Bar -->
  <g transform="translate(44, 20)">
    <!-- Category Label -->
    <text x="0" y="16" class="mono" font-size="11" font-weight="600" fill="#9ba09d" letter-spacing="1.4">
      AI SYSTEMS &amp; INFRASTRUCTURE
    </text>

    <!-- Anchored Status Pill -->
    <g transform="translate(624, 2)">
      <rect width="168" height="22" rx="11" fill="#0d1711" stroke="#1e3b26" stroke-width="1" />
      <circle cx="13" cy="11" r="5" fill="#46a35f" fill-opacity="0.25" />
      <circle cx="13" cy="11" r="3" fill="#46a35f" />
      <text x="25" y="14.5" class="mono" font-size="9.5" font-weight="600" fill="#68b57d" letter-spacing="0.8">
        AVAILABLE FOR WORK
      </text>
    </g>
  </g>

  <!-- Hairline Rule -->
  <line x1="44" y1="54" x2="836" y2="54" stroke="#1d2021" stroke-width="1" />

  <!-- Primary Headline: Name -->
  <text x="44" y="98" class="sans" font-size="34" font-weight="700" fill="#ecedec" letter-spacing="-0.5">
    Abdur Rafay
  </text>

  <!-- Subtitle / Mission Statement -->
  <text x="44" y="130" class="sans" font-size="15.5" font-weight="500" fill="#ecedec">
    I build <tspan fill="#f08a6a">multi-agent systems</tspan> and the infrastructure behind them.
  </text>

  <!-- Technical Scope Description -->
  <text x="44" y="156" class="sans" font-size="13" fill="#9ba09d">
    Autonomous planning loops, local time-travel debugging, persistent memory, and real-time voice pipelines.
  </text>

  <!-- Exterior Border Stroke -->
  <rect x="0.75" y="0.75" width="878.5" height="198.5" rx="11.25" fill="none" stroke="url(#borderGrad)" stroke-width="1.5" />
</svg>
